<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI News Radar | B.L.A.S.T. Dashboard</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>AI News <span>Radar</span></h1>
          <span class="badge-tag">B.L.A.S.T. MVP</span>
        </div>
      </div>

      <div class="header-actions">
        <div class="last-updated">
          <span class="pulse-dot"></span>
          <span id="last-updated-text">Updated just now</span>
        </div>
        
        <button id="refresh-btn" class="btn-refresh" title="Refresh RSS Feeds">
          <svg id="refresh-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
          <span>Refresh</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Dashboard Container -->
  <main class="dashboard-container">

    <!-- Search & Control Bar -->
    <section class="controls-section">
      <div class="search-wrapper">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" placeholder="Search trending AI articles, models, tools..." autocomplete="off">
        <button id="clear-search" class="clear-search-btn" style="display:none;">&times;</button>
      </div>

      <div class="sort-wrapper">
        <label for="sort-select">Sort by:</label>
        <select id="sort-select">
          <option value="newest">Newest First</option>
          <option value="source">Source</option>
          <option value="title">Title (A-Z)</option>
        </select>
      </div>
    </section>

    <!-- Category Pill Filter Bar -->
    <section class="filter-section">
      <div class="pills-scroll-container" id="category-pills">
        <!-- Generated dynamically in app.js -->
      </div>
    </section>

    <!-- Stats Banner -->
    <section class="stats-bar">
      <div class="stats-text">
        Showing <strong id="visible-count">0</strong> of <strong id="total-count">0</strong> articles
      </div>
    </section>

    <!-- Articles Card Grid -->
    <section class="articles-grid" id="articles-grid">
      <!-- Loading Skeleton Cards -->
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </section>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state" style="display: none;">
      <div class="empty-icon">🔍</div>
      <h3>No matching articles found</h3>
      <p>Try adjusting your search query or selecting a different category filter.</p>
      <button id="reset-filters-btn" class="btn-secondary">Reset All Filters</button>
    </div>

  </main>

  <!-- Toast Notification Popup -->
  <div id="toast-container" class="toast-container"></div>

  <!-- JavaScript Entry Point -->
  <script src="/app.js"></script>
</body>
</html>
